version: '3.8'

services:
  backend:
    build: ./backend
    container_name: financial-agent-backend
    ports: ["8000:8000"]
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      - LLM_API_BASE=${LLM_API_BASE}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/financial_agent
      - REDIS_HOST=redis
      - CHROMA_PERSIST_DIR=/app/data/chromadb
    volumes:
      - chroma_data:/app/data
      - ./logs:/app/logs
    depends_on: [postgres, redis]
    networks: [financial-net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: financial-agent-frontend
    ports: ["3000:80"]
    depends_on: [backend]
    networks: [financial-net]
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg15
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_agent
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [financial-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    networks: [financial-net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: [./infra/prometheus.yml:/etc/prometheus/prometheus.yml, prometheus_data:/prometheus]
    networks: [financial-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment: { GF_SECURITY_ADMIN_PASSWORD: admin, GF_USERS_ALLOW_SIGN_UP: "false" }
    volumes: [grafana_data:/var/lib/grafana]
    depends_on: [prometheus]
    networks: [financial-net]
    restart: unless-stopped

networks:
  financial-net: { driver: bridge }

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  prometheus_data:
  grafana_data:
